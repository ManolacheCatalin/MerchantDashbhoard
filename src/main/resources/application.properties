spring.application.name=awinMerchant

# Local startup uses the dev profile (demo seed into "awin") unless another profile is activated.
# Tests activate "test" explicitly, so this default does not apply to them.
spring.profiles.default=dev

# Liquibase applies the schema (and, under the dev profile, the demo seed) to the "awin" database.
# Credentials come from the environment; only the dev profile has a local default password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/awin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema changesets have no context and always run. Demo seed changesets are "@dev" and
# run only when the dev profile sets spring.liquibase.contexts=dev.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
